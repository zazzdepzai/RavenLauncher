name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  core:
    name: Build C++ core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libssl-dev nlohmann-json3-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload core library artifact
        uses: actions/upload-artifact@v4
        with:
          name: mclauncher-core-linux
          path: build/libmclauncher_core.a

  desktop-hud:
    name: Build desktop HUD preview (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsfml-dev

      - name: Configure
        run: cmake -B desktop/build -S desktop

      - name: Build
        run: cmake --build desktop/build

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ravenxd-hud-desktop-linux
          path: desktop/build/ravenxd_hud_desktop

  ios:
    name: Build iOS app (macOS)
    runs-on: macos-latest
    # This job only runs once an .xcodeproj / .xcworkspace exists in the repo
    # (see README.md, "Create the actual Xcode project"). Until then, comment
    # this job out or it will fail at the "Build" step with "no such project".
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Show available schemes
        run: xcodebuild -list -project MCLauncherIOS.xcodeproj

      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild build \
            -project MCLauncherIOS.xcodeproj \
            -scheme MCLauncherIOS \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO

